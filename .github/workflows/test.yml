name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -B tools/run_tests.py

  build-modules:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build module import artifacts
        run: python -B -m tools.streamerbot_import.build_all_modules --output dist/modules

      - name: Upload module artifacts
        uses: actions/upload-artifact@v6
        with:
          name: streamerbot-module-imports
          path: dist/modules
          if-no-files-found: error
