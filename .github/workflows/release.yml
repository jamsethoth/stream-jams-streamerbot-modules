name: module-release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-archive:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -B tools/run_tests.py

      - name: Build release archive
        run: >
          python -B -m tools.streamerbot_import.build_all_modules
          --output dist/modules
          --archive dist/stream-jams-streamerbot-modules.zip

      - name: Upload release archive
        uses: actions/upload-artifact@v6
        with:
          name: stream-jams-streamerbot-modules
          path: dist/stream-jams-streamerbot-modules.zip
          if-no-files-found: error
